<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><title>LOTO6 Analyzer</title><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./styles.css"><script src="./analysis.js" defer></script><script src="./generator.js" defer></script><script src="./storage.js" defer></script><script src="./app.js" defer></script></head><body><main class="shell"><header><div><p>STATISTICAL PICK ASSISTANT</p><h1>LOTO6 Analyzer</h1></div><span id="freshness">読込中</span></header><section class="card"><div><span>最新結果</span><h2 id="draw-title">—</h2><div id="draw-date">—</div></div><div id="latest-balls" class="balls"></div><div id="bonus">BONUS —</div><small id="meta"></small></section><section class="card"><label>生成口数<select id="pick-count"><option>1</option><option>2</option><option>3</option><option>4</option><option selected>5</option></select></label><label>モード<select id="mode"><option value="auto" selected>AUTO</option><option value="balanced">BALANCED</option><option value="diversity">DIVERSITY</option><option value="hotcold">HOT × COLD</option><option value="random">RANDOM</option></select></label><button id="generate">おすすめ番号を生成</button><small>各6数字の数学的な1等確率は同じです。過去分布との類似度と複数口の分散を評価します。</small></section><section id="results"></section><section class="card"><h3>月間予算</h3><label>上限<select id="budget"><option value="3000">3,000円</option><option value="4000">4,000円</option><option value="5000" selected>5,000円</option></select></label><p id="spent">購入済み 0円</p><p id="budget-left"></p></section><section class="card"><h3>生成履歴</h3><div id="history"></div><button class="sub" id="clear-history">履歴を消去</button></section><footer>データ源: みずほ銀行公開当せん番号。将来の当せんを保証・予測するものではありません。</footer></main></body></html>
